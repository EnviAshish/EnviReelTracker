
name: Build ENVI Reel Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source ZIP
        run: unzip -o EnviReelTracker_Source.zip

      - name: Build Debug APK
        run: gradle -p EnviReelTracker assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnviReelTracker-debug-apk
          path: EnviReelTracker/app/build/outputs/apk/debug/app-debug.apk
